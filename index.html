<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon / Aba do navegador ── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/tracto-icon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/tracto-icon.png?v=3" />
    <link rel="shortcut icon" href="/tracto-icon.png?v=3" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO básico ── -->
    <title>Tracto — Inteligência Agronômica</title>
    <meta name="description" content="Tracto une tecnologia orbital e inteligência agronômica para decisões de alta precisão na sua lavoura." />
    <meta name="theme-color" content="#ec5b13" />

    <!-- ── Open Graph (WhatsApp, redes sociais) ── -->
    <meta property="og:title" content="Tracto — Inteligência Agronômica" />
    <meta property="og:description" content="Monitoramento de talhões, alertas climáticos e IA agronômica na palma da sua mão." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/tracto-icon.png" />

    <!-- ── Material Symbols — preload para evitar flash de texto ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <!-- Inline fallback: oculta ícones até a fonte carregar -->
    <style>
      .material-symbols-outlined { font-size: 20px; line-height: 1; font-family: 'Material Symbols Outlined', monospace; font-style: normal; }
    </style>

    <script src="https://www.google.com/recaptcha/api.js?render=%VITE_RECAPTCHA_SITE_KEY%"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
