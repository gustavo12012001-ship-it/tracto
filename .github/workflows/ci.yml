name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint:prod
      - run: npm test -- --run
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracto-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            tracto-backend/requirements.txt
            tracto-backend/requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.example$' ; then
            echo "::error::Arquivo .env (não .example) está em git tracking. Remova com 'git rm --cached'."
            exit 1
          fi
      - name: Check for obvious secret patterns
        run: |
          # sk-ant (Anthropic), gsk_ (Groq), AKIA (AWS), APP_USR-/APP-/access tokens (Mercado Pago prod),
          # eyJ...service_role (Supabase service JWT), sb_secret_ (novo formato de chave Supabase)
          if git grep -nE 'sk-ant-api03-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|APP_USR-[0-9]{6,}-[0-9a-f]{6,}|sb_secret_[A-Za-z0-9_-]{20,}|service_role.{0,40}eyJ[A-Za-z0-9._-]{40,}' -- ':!*.example' ':!*.md' ':!.github/'; then
            echo "::error::Padrão de secret detectado no código. Rotacione e remova."
            exit 1
          fi
